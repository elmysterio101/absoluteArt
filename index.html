<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Absolute Art</title>
</head>

<body>
    <div class="configuracionCapa" id="configuracionCapaActual">
        <button id="cerrarConfCapa" type="button"
            onclick="document.getElementById('configuracionCapaActual').style.display = 'none'">x</button>

        <p id="nombreCapaConfigurada">nombreCapa</p>
        <div class="variablesCapa">
            <div class="variableCapa">
                <p id="letreroCapaOpacidad">opacidad : 1</p>
                <input type="range" name="" id="capaOpacidad" step="0.01" min="0" max="1" value="1"
                    oninput="cambiarOpacidadCapa()">
            </div>
            <div class="variableCapa">
                <p id="LetreroCapaVisibilidad">visible : true</p>
                <input type="checkbox" name="" id="capaVisibilidad" checked onchange="cambiarVisibilidadCapa()">
            </div>
            <div class="variableCapa">
                <p id="letreroCapaEditabilidad">editable : true</p>
                <input type="checkbox" name="" id="capaEditabilidad" checked onchange="cambiarEditabilidadCapa()">
            </div>
            <div class="variableCapa">
                <p id="letreroCapaPadre">selector capa padre</p>
                <div class="cambiarGrupo">
                    <select name="" id="selectorCapaPadre">
                    </select>

                    <button type="button" onclick="cambiarCapaGrupo()">cambiar</button>
                </div>

            </div>
            <div class="variableCapa">
                <p>cordenadaX : </p>
                <input type="number" name="" id="capaCordenadaX" value="0" step="1">
            </div>
            <div class="variableCapa">
                <p>cordenadaY : </p>
                <input type="number" name="" id="capaCordenadaY" value="0" step="1">
            </div>

        </div>

        <div class="acciones">
            <button type="button" onclick="duplicarCapa() ">duplicar capa</button>
            <button type="button" onclick="moverCapaLista(capaActual, 1) ">mover arriba capa</button>
            <button type="button" onclick="moverCapaLista(capaActual, -1) ">mover abajo capa</button>
            <button type="button">Editar capa individual</button>
            <button type="button">Mover capa(canvas)</button>
            <button type="button">Redimenzionar capa</button>
            <button type="button" onclick="eliminarCapaActual()">Eliminar capa</button>
        </div>
    </div>

    <div class="seccionArriba">
        <div class="barraMenu">
            <button type="button" id="retrocederTrazo" onclick="revertirTrazo()">atras</button>
            <button type="button" id="recuperarTrazo" onclick="recuperarTrazo()">adeltante</button>
        </div>
        <div class="barraHerramientas">
            <select id="herramientas" oninput="tipoHerramienta = 'dibujo' , 
                                                categoriaHerramienta = 'herramientas' , 
                                                herramienta = document.getElementById('herramientas').value">
                <option value="undefined"> no seleccionar este sino es para cambiar herramienta</option>
            </select>
            <select id="pinceles" oninput="tipoHerramienta = 'dibujo' , 
                                           categoriaHerramienta = 'pinceles' , 
                                            herramienta = document.getElementById('pinceles').value">
                <option value="undefined"> no seleccionar este sino es para cambiar herramienta</option>
            </select>
            <select id="figuras" oninput="tipoHerramienta = 'dibujo' , 
                                          categoriaHerramienta = 'figuras' , 
                                          herramienta = document.getElementById('figuras').value">
                <option value="undefined"> no seleccionar este sino es para cambiar herramienta</option>
            </select>
            <div class="color">
                <p>colorPrincipal</p>
                <input type="color" name="" id="colorPrincipal"
                    onchange=" colorPrincipal = hexToRgb(document.getElementById('colorPrincipal').value)">
            </div>

            <div class="color">
                <p>colorSecundario</p>
                <input type="color" name="" id="colorSecundario"
                    onchange=" colorSecundario =  hexToRgb(document.getElementById('colorSecundario').value)">
            </div>
        </div>
    </div>

    <section class="lienzo">
        <div class="seccionIzquierda">

            <div class="configuracionLapizFondo">
                <div class="rango">
                    <p>grosor</p>
                    <input type="range" name="" min="1" value="100" max="400" step="1" id="grosor"
                        oninput="grosor = document.getElementById('grosor').value, document.getElementById('cartelGrosor').innerHTML = grosor">
                    <p id="cartelGrosor">100</p>
                </div>

                <div class="rango">
                    <p>opprin</p>
                    <input type="range" name="" min="0" value="0.3" max="1" step="0.01" id="opacidadPrincipal"
                        oninput="opacidadPrincipal = document.getElementById('opacidadPrincipal').value,
                                                                                                         document.getElementById('cartelOpacPrin').innerHTML = opacidadPrincipal">
                    <p id="cartelOpacPrin">0.3</p>
                </div>

                <div class="rango">
                    <p>opsecu</p>
                    <input type="range" name="" min="0" value="1" max="1" step="0.01" id="opacidadSecundaria"
                        oninput="opacidadSecundaria = document.getElementById('opacidadSecundaria').value,
                                                                                                         document.getElementById('cartelOpacSecu').innerHTML = opacidadPrincipal">
                    <p id="cartelOpacSecu">1</p>
                </div>

            </div>
            <div class="visualizacionHistorial"></div>
        </div>

        <canvas height="720" width="1280" id="canvasPrincipal">

        </canvas>

        <div class="seccionDerecha">
            <div class="botones-agregar-capas">
                <button type="button" onclick="agregarCapaDom('individual')">agregar capa</button>
                <button type="button" onclick="agregarCapaDom('grupo')">agregar grupo</button>
            </div>
            <div class="representacionCapas">


                <div class="representacionCapa representacionCapaGrupo" id="representacionGrupo0">
                    <input type="checkbox" name="" class="input" id="desplegableCapa0">

                    <div class="portada">
                        <label for="desplegableCapa0" class="plegado">
                            <p> > </p>
                        </label>
                        <button type="button" class="infoPlegado" onclick="seleccionarCapa(0 , 'grupo')">
                            <p class="nombreCapa"> grupo 0</p>
                            <canvas id="canvasgrupocapa0" height="720" width="1280"></canvas>
                        </button>
                    </div>
                    <div class="contenido" id="contenido0">

                        <div class="representacionCapa representacionCapaGrupo capaIndividual activo"
                            id="representacionCapa0">
                            <input type="checkbox" name="" class="input" id="visibilidadCapa0 onchange= "
                                cambiarVisibilidadCapa('individual' , 0)">
                            <div class="portada">
                                <label for="visibilidadCapa0" class="plegado">
                                    <p>0</p>
                                </label>
                                <button type="button" class="infoPlegado" onclick="seleccionarCapa(0 , 'individual')">
                                    <p class="nombreCapa"> capa 0</p>
                                    <canvas id="canvasindividualcapa0" height="720" width="1280"></canvas>
                                </button>
                            </div>
                        </div>

                    </div>
                </div>



            </div>

        </div>
    </section>
    <div class="barraEstatus">

    </div>

    <script src="js/paint.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
